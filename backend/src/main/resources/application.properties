spring.application.name=eduneko-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/eduneko
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# OpenAI - Generacion de contenido educativo
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/responses
openai.api.model=gpt-4.1-mini