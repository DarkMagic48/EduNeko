# =====================================================
# EDUNEKO V1 - CONFIGURACION DE PRODUCCION
# Se activa exclusivamente con el perfil "prod".
# No modifica la configuracion local.
# =====================================================

# Puerto asignado por el proveedor de alojamiento
server.port=${PORT:8080}

# Base de datos PostgreSQL de produccion
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Administracion de conexiones mediante HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Validar el esquema existente
spring.jpa.hibernate.ddl-auto=validate

# Evitar mostrar consultas SQL en produccion
spring.jpa.show-sql=false

# Aplicar migraciones Flyway
spring.flyway.enabled=true

# Origenes autorizados del frontend en produccion
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:}