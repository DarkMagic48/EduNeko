
# =====================================================
# EDUNEKO V1 - CONFIGURACION DE PRODUCCION
# Se activa exclusivamente con el perfil "prod".
# No modifica la configuracion local.
# =====================================================

# Puerto asignado por el proveedor de alojamiento
server.port=${PORT:8080}

# Base de datos PostgreSQL de produccion
# DATABASE_URL debe ser una URL JDBC de PostgreSQL.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Validar el esquema existente
spring.jpa.hibernate.ddl-auto=validate

# Evitar mostrar consultas SQL en produccion
spring.jpa.show-sql=false

# Aplicar migraciones Flyway
spring.flyway.enabled=true
