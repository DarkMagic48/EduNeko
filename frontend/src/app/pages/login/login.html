<h1>Iniciar sesión</h1>

<form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()">

  <div>
    <label for="correo">Correo electrónico</label>
    <input
      id="correo"
      type="email"
      formControlName="correo"
    >
  </div>

  <div>
    <label for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      formControlName="password"
    >
  </div>

  <button type="submit">
    Iniciar sesión
  </button>

</form>
